---
name: Documentation Screenshots

on:
  push:
    branches:
      - main
    paths:
      - "content/extensions/**"
      - "content/plugins/catalog.json"
  workflow_dispatch:
    inputs:
      kumbuka_ref:
        description: Kumbuka server branch, tag, or commit to capture
        required: true
        default: main
        type: string
      plugins_ref:
        description: First-party plugins branch, tag, or commit to capture
        required: true
        default: main
        type: string

jobs:
  screenshots:
    name: Update Screenshots
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out documentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check out Kumbuka server
        uses: actions/checkout@v7
        with:
          repository: kumbuka-me/kumbuka
          ref: ${{ inputs.kumbuka_ref || 'main' }}
          path: .kumbuka-server
          fetch-depth: 1

      - name: Check out first-party plugins
        uses: actions/checkout@v7
        with:
          repository: kumbuka-me/plugins
          ref: ${{ inputs.plugins_ref || 'main' }}
          path: .kumbuka-plugins
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .kumbuka-server/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: .kumbuka-server/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .kumbuka-server/package-lock.json

      - name: Install documentation screenshot dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Kumbuka dependencies
        working-directory: .kumbuka-server
        run: |
          npm ci
          go mod download
          make generate web
          go build -o kumbuka ./cmd/kumbuka

      - name: Generate screenshots from documentation content
        run: |
          make screenshots \
            KUMBUKA="$GITHUB_WORKSPACE/.kumbuka-server/kumbuka" \
            SCREENSHOT_PLUGINS_DIR="$GITHUB_WORKSPACE/.kumbuka-plugins" \
            SCREENSHOT_SKIP_BROWSER_INSTALL=1

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: documentation-screenshots
          path: |
            assets/screenshots/*.png
            assets/plugins/*/preview.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit changed screenshots
        if: github.ref_type == 'branch'
        run: |
          git add -A assets/screenshots assets/plugins
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
