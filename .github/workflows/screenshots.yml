---
name: Documentation Screenshots

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "scripts/screenshots/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

concurrency:
  group: documentation-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    name: Update Screenshots
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out documentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install screenshot dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate screenshots
        env:
          SCREENSHOT_HEALTH_TIMEOUT_SECONDS: "120"
        run: make screenshots SCREENSHOT_SKIP_BROWSER_INSTALL=1

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: documentation-screenshots
          path: |
            assets/screenshots/*.png
            assets/plugins/*/preview.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit changed screenshots
        if: github.ref_type == 'branch'
        run: |
          git add -A assets/screenshots assets/plugins
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update screenshots"
          snapshot=$(git rev-parse HEAD)
          changed_paths=$(mktemp)
          deleted_paths=$(mktemp)
          trap 'rm -f "$changed_paths" "$deleted_paths"' EXIT
          git diff --name-only --diff-filter=d -z HEAD^ HEAD -- assets/screenshots assets/plugins > "$changed_paths"
          git diff --name-only --diff-filter=D -z HEAD^ HEAD -- assets/screenshots assets/plugins > "$deleted_paths"

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            # This checkout is disposable. Reapply only the generated changes
            # onto the latest branch so concurrent documentation commits survive.
            git reset --hard FETCH_HEAD
            if [ -s "$changed_paths" ]; then
              git restore --source="$snapshot" --staged --worktree --pathspec-from-file="$changed_paths" --pathspec-file-nul
            fi
            if [ -s "$deleted_paths" ]; then
              git rm --ignore-unmatch --pathspec-from-file="$deleted_paths" --pathspec-file-nul
            fi
            if git diff --cached --quiet; then
              echo "Screenshots are already up to date."
              exit 0
            fi
            git commit -m "docs: update screenshots"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Screenshot push failed on attempt $attempt of 3."
          done
          echo "::error::Could not publish screenshots after 3 attempts."
          exit 1
