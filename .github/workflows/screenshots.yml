---
name: Documentation Screenshots

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "scripts/screenshots/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

jobs:
  screenshots:
    name: Update Screenshots
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out documentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install screenshot dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate screenshots
        run: make screenshots SCREENSHOT_SKIP_BROWSER_INSTALL=1

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: documentation-screenshots
          path: |
            assets/screenshots/*.png
            assets/plugins/*/preview.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit changed screenshots
        if: github.ref_type == 'branch'
        run: |
          git add -A assets/screenshots assets/plugins
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
